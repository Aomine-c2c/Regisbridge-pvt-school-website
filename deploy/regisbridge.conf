# ==============================================================================
# Regisbridge School Management System — Host Nginx Virtual Host Configuration
# Install on host: /etc/nginx/sites-available/regisbridge.conf
# Enable: ln -s /etc/nginx/sites-available/regisbridge.conf /etc/nginx/sites-enabled/
# Test & Reload: nginx -t && systemctl reload nginx
# Obtain SSL: certbot --nginx -d school.regisbridge.com
# ==============================================================================

server {
    listen 80;
    server_name school.regisbridge.com; # Change to your domain or server IP

    client_max_body_size 50M;

    # Enable Let's Encrypt renewal validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all traffic to Regisbridge internal gateway via Unix Domain Socket
    location / {
        proxy_pass http://unix:/run/regisbridge/app.sock;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering & timeouts
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
