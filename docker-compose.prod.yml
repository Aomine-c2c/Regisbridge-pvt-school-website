# ==============================================================================
# Regisbridge School Management System — Production Docker Compose
# Architecture: Multi-tier, Zero-Host-Port Unix Domain Socket Gateway
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 Alpine
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: regisbridge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - regisbridge_db_data:/var/lib/postgresql/data
      - ./infrastructure/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - regisbridge_net

  # ----------------------------------------------------------------------------
  # 2. Backend: Python 3.12 Django / django-tenants / Gunicorn
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regisbridge_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DB_NAME: regisbridge_django
      DJANGO_DB_USER: ${POSTGRES_USER:-postgres}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@regisbridge.edu}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Admin123!}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - regisbridge_django_static:/app/staticfiles
      - regisbridge_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - regisbridge_net

  # ----------------------------------------------------------------------------
  # 3. Frontend: Next.js 15 Standalone
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: regisbridge_frontend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/regisbridge_web
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@regisbridge.edu}
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - regisbridge_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - regisbridge_net

  # ----------------------------------------------------------------------------
  # 4. Gateway: Internal Nginx Unix Domain Socket Router
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: regisbridge_gateway
    restart: unless-stopped
    volumes:
      # Host socket directory shared with host Nginx
      - ${SOCKET_DIR:-/run/regisbridge}:/run/regisbridge
      # Static and user uploads served directly by Gateway Nginx
      - regisbridge_uploads:/var/www/uploads:ro
      - regisbridge_django_static:/var/www/django_static:ro
      - regisbridge_media:/var/www/media:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - regisbridge_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  regisbridge_db_data:
    name: regisbridge_db_data
  regisbridge_uploads:
    name: regisbridge_uploads
  regisbridge_django_static:
    name: regisbridge_django_static
  regisbridge_media:
    name: regisbridge_media

# ==============================================================================
# Isolated Internal Bridge Network
# ==============================================================================
networks:
  regisbridge_net:
    name: regisbridge_net
    driver: bridge
